<div
    [id]="event().id"
    class="fr-card fr-enlarge-link"
>
    <div class="fr-card__body">
        <div class="fr-card__content">
            <h3 class="fr-card__title">
                <a [href]="event().url">
                    {{ event().title }}
                </a>
            </h3>
        </div>
    </div>
    <div class="fr-card__header">
        <div class="fr-card__img">
            <img
                class="fr-responsive-img"
                [src]="event().cover_url"
                [alt]="event().title"
            />
        </div>
    </div>
</div>
