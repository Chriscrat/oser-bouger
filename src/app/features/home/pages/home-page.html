<div class="fr-container">
    <div class="fr-my-7w fr-mt-md-12w fr-mb-md-10w fr-grid-row fr-grid-row--center">
        <div class="fr-container--fluid">
            <app-alert
                [alert]="alert"
                type="warning"
            ></app-alert>
            @if (isFallbackMode()) {
                <div class="fr-mt-2w">
                    <app-alert
                        [alert]="fallbackAlert"
                        type="info"
                    ></app-alert>
                </div>
            }
            <app-hero></app-hero>
        </div>

        <app-event-list></app-event-list>
    </div>
</div>
<app-sidemenu>
    <div sidemenu-title>Filtres de recherches</div>
    <app-event-filters sidemenu-content></app-event-filters>
</app-sidemenu>
