<div class="fr-checkbox-group">
    <input  
        [id]="title()"
        type="checkbox"
        aria-describedby="checkbox-messages"
        [checked]="isChecked()"
        (change)="onChange($event)"
    />
    <label
        class="fr-label"
        [for]="title()"
    >
        <ng-content select='[checkbox-text]'></ng-content>
    </label>
    <div
        class="fr-messages-group"
        id="checkbox-messages"
        aria-live="polite"
    ></div>
</div>
