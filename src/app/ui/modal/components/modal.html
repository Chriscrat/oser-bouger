<button
    data-fr-opened="false"
    [aria-controls]="modalId()"
    [id]="buttonModalId()"
    type="button"
    class="fr-btn fr-btn--tertiary-no-outline fr-modal-trigger"
>
    {{ buttonTitle() }}
    <app-icon icon="arrow-right"></app-icon>
</button>

<dialog
    [id]="modalId()"
    class="fr-modal"
    [aria-labelledby]="modalTitleId()"
>
    <div class="fr-container fr-container--fluid fr-container-lg">
        <div class="fr-grid-row fr-grid-row--center">
            <div class="fr-col-12 fr-col-md-8 fr-col-lg-10">
                <div class="fr-modal__body">
                    <div class="fr-modal__content fr-mb-12v fr-px-0">
                        <ng-content select="[modal-content]"/>
                    </div>
                    <div class="fr-modal__footer">
                        <div class="fr-btns-group fr-btns-group--inline-lg fr-btns-group--icon-left">
                            <ul class="fr-btns-group fr-btns-group--right fr-btns-group--inline-lg fr-btns-group--icon-left">
                                <li>
                                    <button
                                        [id]="buttonId()"
                                        [aria-controls]="modalId()"
                                        type="button"
                                        title="Fermer"
                                        class="fr-btn"
                                    >
                                        Fermer
                                    </button>
                                </li>
                                <ng-content select="[modal-footer]"/>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</dialog>
